# =====================================================================
#  Fluxify 12.0 - Samsung kilit ekrani saati -> widget rakam gecisi
#  YALNIZCA One UI 8.5+ Samsung. Root ve LSPosed / Vector GEREKIR.
#  TEK DOSYA: tum kaynak kod, sikistirilmis olarak dosyanin SONUNDADIR
#  ("#P:" satirlari). Onlari silmeyin veya degistirmeyin.
#  Dosya eksik kopyalanirsa derleme KIRMIZI olur.
#
#  Kullanim:
#   1) Bu dosyayi GitHub'da  .github/workflows/build.yml  yoluna yukleyin
#      (kopyala-yapistir yerine "Add file > Upload files" onerilir).
#   2) Derleme kendiliginden baslar (Actions sekmesi).
#   3) APK: deponun  Releases  bolumunde "Fluxify-v<numara>.apk".
#   NOT: Depo herkese aciksa Releases'teki APK de herkese acik olur.
#
#  Kalici imza (istege bagli, onerilir). Settings > Secrets > Actions:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#  Secret yoksa her derlemede yeni anahtar uretilir; yeni surumu kurmadan
#  once eskisini KALDIRMANIZ gerekir.
# =====================================================================
name: Fluxify APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write   # APK'yi Releases bolumune koymak icin gerekli

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK bilesenleri
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_JAR=$SDK/platforms/android-36/android.jar" >> "$GITHUB_ENV"
          echo "BT=$SDK/build-tools/36.0.0" >> "$GITHUB_ENV"

      - name: Kaynak kodunu cikar ve butunlugunu kontrol et
        shell: bash
        run: |
          set -euo pipefail
          WF="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}"
          WF="${WF%@*}"
          sed -n 's/^#P://p' "$WF" | tr -d ' \r\n' > "$RUNNER_TEMP/src.b64"
          if ! echo "56ba199185a8fd23fe555e22fb4f7de90a87857ec22ce12bd5af40a71a0c4b28  $RUNNER_TEMP/src.b64" | sha256sum -c --status; then
            echo "::error::build.yml eksik veya bozuk kopyalanmis. Dosyayi kopyala-yapistir yerine 'Upload files' ile yukleyin."
            exit 1
          fi
          rm -rf project dist
          mkdir -p project
          base64 -d "$RUNNER_TEMP/src.b64" | tar -xJf - -C project
          find project -type f | sort

      - name: Imza anahtari
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/sign.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"; KPASS="$KEY_PASSWORD"
          else
            echo "::warning::Kalici imza anahtari yok; gecici anahtar uretiliyor."
            PASS="$(openssl rand -hex 16)"; ALIAS=fluxclock; KPASS="$PASS"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$PASS" \
              -keypass "$KPASS" -alias "$ALIAS" -keyalg RSA -keysize 3072 \
              -validity 10000 -dname "CN=Fluxify"
          fi
          {
            echo "KS_FILE=$KS"
            echo "KS_PASS=$PASS"
            echo "KS_ALIAS=$ALIAS"
            echo "KEY_PASS=$KPASS"
          } >> "$GITHUB_ENV"

      - name: APK derle
        shell: bash
        working-directory: project
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: bash build.sh

      - name: APK dogrula
        shell: bash
        run: |
          set -euo pipefail
          APK=project/out/FluxClock.apk
          test -s "$APK" || { echo "::error::APK olusmadi"; exit 1; }
          "$BT/apksigner" verify "$APK"
          "$BT/aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -q "^package: name='com.fluxclock.transition'" "$RUNNER_TEMP/badging.txt"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/files.txt"
          for f in AndroidManifest.xml classes.dex assets/xposed_init assets/flux_0.ttf assets/flux_1.ttf assets/flux_2.ttf assets/dots.ttf assets/segment.ttf assets/outline.ttf res/layout/widget_row.xml res/layout/widget_stack.xml res/xml/flux_widget.xml; do
            grep -qx "$f" "$RUNNER_TEMP/files.txt" || { echo "::error::APK icinde eksik: $f"; exit 1; }
          done
          NAME="Fluxify-v${GITHUB_RUN_NUMBER}.apk"
          mkdir -p dist
          cp "$APK" "dist/$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          ls -l dist
          sha256sum "dist/$NAME"

      - name: APK yukle (Artifacts)
        id: artifact
        uses: actions/upload-artifact@v6
        with:
          name: Fluxify-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Ozet - Artifacts baglantisi
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo "## APK olustu ve dogrulandi: $APK_NAME"
            echo ""
            echo "- [Zip olarak indir (Artifacts)]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK'yi Releases bolumune koy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="fluxclock-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          publish() {
            gh release create "$TAG" "dist/$APK_NAME" --repo "$GITHUB_REPOSITORY"               --title "Fluxify 12.0 (derleme $GITHUB_RUN_NUMBER)"               --notes "Yalnizca One UI 8.5+ Samsung. Root ve LSPosed/Vector gerekir. Dosya: $APK_NAME"               --latest "$@"
          }
          publish --target "$GITHUB_SHA" || publish
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$APK_NAME"
          echo "- [**APK dosyasini dogrudan indir**]($URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=APK hazir::$URL"

